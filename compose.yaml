# FaultTwin AI lab cluster: one PostgreSQL primary and two asynchronous streaming replicas,
# plus (Phase 5) FaultTwin's own meta-db and, behind the "observability" profile, Prometheus
# and Grafana for FaultTwin's self-observability.
#
# Server flags are repeated per service on purpose: Compose cannot splice one list into
# another, and each node needs its own cluster_name (replicas report it to the primary as
# application_name, which is how the collector matches replication edges to nodes).
#
# Lab only. Secrets come from .env (create it with scripts/lab-init-env.sh; never commit it).
# Ports are published on 127.0.0.1 only. Every container carries the label
# faulttwin.role=lab-target, and every server runs with faulttwin.lab=on, which the fault
# injection guards (Phase 6, docs/architecture/overview.md §6.9) will require.
name: faulttwin-lab

x-postgres-image: &postgres-image
  # PostgreSQL 17.12 (Debian bookworm), pinned to the multi-arch index digest so that
  # amd64 (Linux, CI) and arm64 (Apple Silicon) resolve the same release.
  image: postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7

services:
  pg-primary:
    <<: *postgres-image
    hostname: pg-primary
    command:
      - postgres
      - -c
      - cluster_name=pg-primary
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=1024MB
      - -c
      - hot_standby=on
      - -c
      - hot_standby_feedback=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
      - -c
      - faulttwin.lab=on
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      FT_REPLICATION_PASSWORD: ${FT_REPLICATION_PASSWORD:?set FT_REPLICATION_PASSWORD in .env}
      FT_MONITOR_PASSWORD: ${FT_MONITOR_PASSWORD:?set FT_MONITOR_PASSWORD in .env}
      FT_WORKLOAD_PASSWORD: ${FT_WORKLOAD_PASSWORD:?set FT_WORKLOAD_PASSWORD in .env}
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./lab/primary/init:/docker-entrypoint-initdb.d:ro
      - ./lab/workload:/lab/workload:ro
    ports:
      - "127.0.0.1:${FT_PG_PRIMARY_PORT:-55432}:5432"
    networks: [lab]
    labels:
      faulttwin.role: lab-target
      faulttwin.node: pg-primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  pg-replica-1:
    <<: *postgres-image
    hostname: pg-replica-1
    entrypoint: [/lab/replica-entrypoint.sh]
    command:
      - postgres
      - -c
      - cluster_name=pg-replica-1
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=1024MB
      - -c
      - hot_standby=on
      - -c
      - hot_standby_feedback=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
      - -c
      - faulttwin.lab=on
    environment: &replica-env
      FT_REPLICATION_PASSWORD: ${FT_REPLICATION_PASSWORD:?set FT_REPLICATION_PASSWORD in .env}
      FT_PRIMARY_HOST: pg-primary
      FT_REPLICATION_SLOT: pg_replica_1
    volumes:
      - pg-replica-1-data:/var/lib/postgresql/data
      - ./lab/replica/replica-entrypoint.sh:/lab/replica-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${FT_PG_REPLICA1_PORT:-55433}:5432"
    networks: [lab]
    labels:
      faulttwin.role: lab-target
      faulttwin.node: pg-replica-1
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck: &replica-health
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s

  pg-replica-2:
    <<: *postgres-image
    hostname: pg-replica-2
    entrypoint: [/lab/replica-entrypoint.sh]
    command:
      - postgres
      - -c
      - cluster_name=pg-replica-2
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=1024MB
      - -c
      - hot_standby=on
      - -c
      - hot_standby_feedback=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
      - -c
      - faulttwin.lab=on
    environment:
      <<: *replica-env
      FT_REPLICATION_SLOT: pg_replica_2
    volumes:
      - pg-replica-2-data:/var/lib/postgresql/data
      - ./lab/replica/replica-entrypoint.sh:/lab/replica-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${FT_PG_REPLICA2_PORT:-55434}:5432"
    networks: [lab]
    labels:
      faulttwin.role: lab-target
      faulttwin.node: pg-replica-2
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck: *replica-health

  # FaultTwin's own database (Phase 5): incidents and, later, approvals and audit records.
  # Deliberately NOT on the lab network and NOT labelled lab-target, so fault injection can
  # never reach the observer's records (docs/architecture/overview.md §3).
  meta-db:
    <<: *postgres-image
    hostname: meta-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      FT_METADB_PASSWORD: ${FT_METADB_PASSWORD:?set FT_METADB_PASSWORD in .env (scripts/lab-init-env.sh)}
    volumes:
      - meta-db-data:/var/lib/postgresql/data
      - ./lab/metadb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${FT_METADB_PORT:-55435}:5432"
    networks: [meta]
    labels:
      faulttwin.role: observer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  # Self-observability (Phase 5), opt-in: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${FT_PROMETHEUS_PORT:-59090}:9090"
    networks: [observability]
    labels:
      faulttwin.role: observer

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${FT_GRAFANA_ADMIN_PASSWORD:?set FT_GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${FT_GRAFANA_PORT:-53000}:3000"
    networks: [observability]
    depends_on: [prometheus]
    labels:
      faulttwin.role: observer

networks:
  lab:
    name: faulttwin-lab
    driver: bridge
  meta:
    name: faulttwin-meta
    driver: bridge
  observability:
    name: faulttwin-observability
    driver: bridge

volumes:
  pg-primary-data:
  pg-replica-1-data:
  pg-replica-2-data:
  meta-db-data:
